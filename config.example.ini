# 该文件用于：管理整个项目的配置（示例模板，配置项与 config.ini 完全一致，请勿在本文件中填写真实密码/密钥）

# MySQL配置
[mysql]
host = localhost
user = root
password = your_mysql_password
database = subject_kg

# Redis配置
[redis]
host = localhost
port = 6379
password = your_redis_password
database = 0

# 日志配置
[log]
log_file = logs\app.log

# Milvus配置
[milvus]
host = localhost
port = 19530
database_name = itcast
collection_name = edurag

# LLM配置
[llm]
model_name = qwen3.8-27b
dashscope_api_key = your_dashscope_api_key
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
# 父级文本分块大小
parent_chunk_size = 1200
# 子级文本分块大小
child_chunk_size = 300
# 文本分块重叠大小
chunk_overlap = 50
# 检索结果数量，检索时从milvus中召回最相似的top3
retrieval_k = 3
# 候选数量，在retrieval_k结果中，进一步筛选的数量（用于给LLM做回答时提供更精准的素材）
candidate_m = 2

# 应用配置
[app]
valid_sources = ['ai','java','test','ops','bigdata']        # 系统允许的有效来源
customer_service_phone = 123456                             # 用户反馈电话号码
