<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传智教育EduRAG智慧问答系统</title>
    <!-- 引入 Font Awesome 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 引入 marked.js 用于解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <link rel="stylesheet" href="/static/fonts/general-sans.css">
<style>

/* ============================================================
   EduRAG 智慧问答系统 — visual layer
   Direction: Colour chapters (candy fields, hard edges, black ink)
   Function untouched: every id/class the script touches is kept.
   ============================================================ */

:root {
    /* chapters */
    --f1: #ffd249;          /* sidebar        */
    --f1-ink: #0a0a0a;
    --f2: #ffffff;          /* conversation   */
    --f2-ink: #0a0a0a;
    --f3: #ffc4ef;          /* user bubble    */
    --f3-ink: #0a0a0a;
    --f4: #a4f6f8;          /* composer band  */
    --f4-ink: #0a0a0a;
    --f5: #f9a21f;          /* brand band     */
    --f5-ink: #0a0a0a;

    --ink: #0a0a0a;
    --muted: #5e4a0a;
    --accent: #f53fd6;
    --accent-ink: #0a0a0a;

    --radius: 10px;
    --gutter: clamp(16px, 2.4vw, 28px);
    --sidebar-w: 300px;

    --step-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
    --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
    --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
    --step-head: clamp(1.5rem, 1.1rem + 1.6vw, 2.25rem);

    --font: 'General Sans', 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
}

/* dark mode: the reading surface goes dark, the chapter colours stay warm */
body.dark-mode {
    --f2: #101010;
    --f2-ink: #f4f2ee;
    --f4: #0d2b2c;
    --f4-ink: #eafcfd;
    --f3: #3a1030;
    --f3-ink: #ffd7f4;
    --f1: #d9a900;
    --f5: #b06a10;
    --muted: #6f5900;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--f2);
    color: var(--f2-ink);
    font-family: var(--font);
    font-size: var(--step-body);
    line-height: 1.55;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
}

/* ---------- chapter 5 · brand band ---------- */

header {
    background: var(--f5);
    color: var(--f5-ink);
    padding: 16px var(--gutter);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    animation: band-in .5s cubic-bezier(.2, .7, .3, 1) both;
}

header h1 {
    margin: 0;
    font-size: var(--step-head);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.05;
    text-wrap: balance;
}

.theme-toggle {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--ink);
    color: var(--f5);
    font-size: 1rem;
    transition: transform .18s ease, background .18s ease, color .18s ease;
}

.theme-toggle:hover { transform: rotate(-18deg) scale(1.06); }
.theme-toggle:active { transform: scale(.94); }

/* ---------- shell ---------- */

.container { flex: 1; min-height: 0; display: flex; }

.chat-container {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
}

/* ---------- chapter 1 · sidebar ---------- */

.sidebar {
    background: var(--f1);
    color: var(--f1-ink);
    padding: var(--gutter);
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    animation: field-in-left .6s cubic-bezier(.2, .7, .3, 1) both;
}

.search-box {
    width: 100%;
    font: inherit;
    font-size: var(--step-small);
    color: var(--ink);
    background: #ffffff;
    border: 1px solid var(--ink); /* taste-skill-ignore */
    border-radius: var(--radius);
    padding: 10px 12px;
}

.search-box::placeholder { color: #6b6b6b; }

.session-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}

.new-session-btn,
.clear-history-btn {
    font-size: var(--step-small);
    font-weight: 700;
    padding: 11px 10px;
    border-radius: var(--radius);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform .16s ease, background .16s ease, color .16s ease;
}

.new-session-btn { background: var(--ink); color: var(--f1); }
.clear-history-btn { background: #ffffff; color: var(--ink); }

.new-session-btn:hover { transform: translateY(-2px); background: var(--accent); color: var(--accent-ink); }
.clear-history-btn:hover { transform: translateY(-2px); background: var(--ink); color: #ffffff; }
.new-session-btn:active,
.clear-history-btn:active { transform: translateY(0) scale(.98); }

.history-title {
    font-size: var(--step-small);
    font-weight: 700;
    letter-spacing: 0;
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 4px;
}

.history-list { display: block; }

.history-list:empty::after {
    content: '还没有历史会话';
    display: block;
    font-size: var(--step-small);
    color: var(--muted);
    padding: 10px 2px;
}

/* JS flips these to display:block / none when searching, so stay block-level */
.history-item {
    display: block;
    background: #ffffff;
    color: var(--ink);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    animation: rise .4s cubic-bezier(.2, .7, .3, 1) both;
    transition: transform .16s ease, background .16s ease;
}

.history-item:hover { transform: translateX(4px); background: var(--f3); }

.history-question {
    display: block;
    font-size: var(--step-small);
    font-weight: 700;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.history-answer {
    display: block;
    margin-top: 3px;
    font-size: var(--step-small);
    color: #5b5b5b;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.session-info {
    margin-top: auto;
    font-size: var(--step-small);
    color: var(--muted);
    line-height: 1.4;
}

/* ---------- chapter 2 · conversation ---------- */

.main-content {
    background: var(--f2);
    color: var(--f2-ink);
    display: flex;
    flex-direction: column;
    min-height: 0;
    position: relative;
    animation: shutter 1.05s cubic-bezier(.7, 0, .2, 1) both;
}

.chat-history {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: var(--gutter);
    display: flex;
    flex-direction: column;
    gap: 22px;
    scroll-behavior: smooth;
}

.message {
    max-width: 68ch;
    animation: rise .45s cubic-bezier(.2, .7, .3, 1) both;
}

.message-header {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 8px;
    font-size: var(--step-small);
    font-weight: 700;
}

.avatar {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: var(--ink);
    color: var(--f1);
    font-size: var(--step-small);
    font-weight: 700;
}

.message-content {
    font-size: var(--step-body);
    line-height: 1.6;
    overflow-wrap: anywhere;
}



/* the opening line is the only thing on a fresh screen, so it leads */

/* the signature sits under the sentence, not above it (no kicker over a headline) */
.chat-history > .message.system-message:first-child {
    display: flex;
    flex-direction: column-reverse;
    align-items: flex-start;
    gap: 10px;
}

.chat-history > .message.system-message:first-child .message-header {
    margin-bottom: 0;
}

.chat-history > .message.system-message:first-child .message-content {
    font-size: clamp(1.35rem, 1.1rem + 0.95vw, 2.05rem);
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.25;
    max-width: 20ch;
    padding-left: 0;
    margin-top: 6px;
}

.user-message {
    align-self: flex-end;
    max-width: 60ch;
}

/* the user side needs no name-plate: the bubble sits on the right in its own
   colour, which already says who is talking. The assistant keeps its avatar. */
.user-message .message-header { display: none; }

.user-message .avatar { background: var(--f3); color: var(--ink); }

.user-message .message-content {
    background: var(--f3);
    color: var(--f3-ink);
    border-radius: var(--radius);
    padding: 13px 17px;
}

/* markdown rendered inside a message */
.message-content > :first-child { margin-top: 0; }
.message-content > :last-child { margin-bottom: 0; }
.message-content p { margin: 0 0 .7em; }
.message-content ul,
.message-content ol { margin: 0 0 .7em; padding-left: 1.3em; }
.message-content li { margin: .22em 0; }

.message-content h1,
.message-content h2,
.message-content h3 {
    font-size: var(--step-lead);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
    margin: .9em 0 .4em;
}

.message-content a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
}

.message-content code {
    font-family: ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;
    font-size: .92em;
    background: rgba(10, 10, 10, .08);
    padding: .1em .38em;
    border-radius: 5px;
}

.message-content pre {
    background: var(--ink);
    color: #f4f2ee;
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 0 0 .7em;
    overflow-x: auto;
    line-height: 1.5;
}

.message-content pre code {
    background: none;
    padding: 0;
    color: inherit;
    font-size: .95em;
}

.message-content blockquote {
    margin: 0 0 .7em;
    padding-left: 14px;
    border-left: 3px solid var(--ink);
    font-weight: 500;
}

.message-content table {
    border-collapse: collapse;
    width: 100%;
    margin: 0 0 .7em;
    font-size: var(--step-small);
}

.message-content th,
.message-content td {
    border-bottom: 1px solid rgba(10, 10, 10, .2);
    padding: 8px 10px;
    text-align: left;
}

.message-content img {
    max-width: 100%;
    height: auto;
    border-radius: var(--radius);
    display: block;
    margin: .5em 0;
}

/* typing dots created by the script */
.typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: max-content;
    margin-left: 41px;
    background: var(--f3);
    border-radius: var(--radius);
    padding: 14px 18px;
}

.typing-indicator span {
    display: block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink);
    animation: dot 1.1s ease-in-out infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: .15s; }
.typing-indicator span:nth-child(3) { animation-delay: .3s; }

/* ---------- chapter 4 · composer ---------- */

.chat-input-container {
    background: var(--f4);
    color: var(--f4-ink);
    padding: 14px var(--gutter) 18px;
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 11px 14px;
    animation: rise .55s .08s cubic-bezier(.2, .7, .3, 1) both;
}

.input-group,
.quick-replies { grid-column: 1 / -1; }

.input-tools { justify-self: end; }

.source-filter {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--step-small);
}

.source-filter label { font-weight: 500; }

.source-filter select {
    font: inherit;
    font-size: var(--step-small);
    color: var(--ink);
    background: #ffffff;
    border: 1px solid var(--ink); /* taste-skill-ignore */
    border-radius: var(--radius);
    padding: 7px 10px;
    cursor: pointer;
}


.input-tools { display: flex; gap: 6px; }

.input-tools .tool-btn { animation: rise .4s cubic-bezier(.2, .7, .3, 1) both; }
.input-tools .tool-btn:nth-child(2) { animation-delay: .06s; }
.input-tools .tool-btn:nth-child(3) { animation-delay: .12s; }
.source-filter { animation: rise .45s .05s cubic-bezier(.2, .7, .3, 1) both; }

.tool-btn {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: transparent;
    color: var(--f4-ink);
    font-size: .95rem;
    transition: background .16s ease, color .16s ease, transform .16s ease;
}

.tool-btn:hover { background: var(--ink); color: var(--f4); transform: translateY(-2px); }
.tool-btn:active { transform: scale(.94); }

.input-group { display: flex; align-items: flex-end; gap: 10px; }

.chat-input {
    flex: 1;
    min-height: 48px;
    max-height: 150px;
    font: inherit;
    font-size: var(--step-body);
    line-height: 1.45;
    color: var(--ink);
    background: #ffffff;
    border: 1px solid var(--ink); /* taste-skill-ignore */
    border-radius: var(--radius);
    padding: 12px 14px;
    resize: none;
    overflow-y: auto;
}

.chat-input::placeholder { color: #6b6b6b; }

.send-btn {
    flex: 0 0 auto;
    min-height: 48px;
    padding: 0 24px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: var(--step-body);
    font-weight: 700;
    border-radius: var(--radius);
    background: var(--accent);
    color: var(--accent-ink);
    transition: transform .16s ease, background .16s ease, color .16s ease;
}

.send-btn:hover { transform: translateY(-2px); background: var(--ink); color: var(--accent); }
.send-btn:active { transform: translateY(0) scale(.97); }


.quick-replies { display: flex; flex-wrap: wrap; gap: 8px; }

.quick-reply-btn { animation: rise .5s cubic-bezier(.2, .7, .3, 1) both; }
.quick-reply-btn:nth-child(1) { animation-delay: .16s; }
.quick-reply-btn:nth-child(2) { animation-delay: .23s; }
.quick-reply-btn:nth-child(3) { animation-delay: .30s; }
.quick-reply-btn:nth-child(4) { animation-delay: .37s; }

.quick-reply-btn {
    font-size: var(--step-small);
    font-weight: 500;
    padding: 9px 15px;
    border-radius: var(--radius);
    background: #ffffff;
    color: var(--ink);
    transition: transform .18s ease, background .18s ease, color .18s ease;
}

.quick-reply-btn:hover {
    transform: translateY(-3px);
    background: var(--ink);
    color: #ffffff;
}

.quick-reply-btn:active { transform: translateY(0) scale(.97); }

/* ---------- loading ---------- */

.loading-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 10, .78);
    visibility: hidden;
    z-index: 20;
}

.spinner {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, .3);
    border-top-color: var(--f1);
    animation: spin .8s linear infinite;
}

/* ---------- motion ---------- */

@keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
}

@keyframes field-in-left {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: none; }
}

@keyframes band-in {
    from { opacity: 0; transform: translateY(-100%); }
    to { opacity: 1; transform: none; }
}

/* the signature move: the conversation field opens from the top edge */
@keyframes shutter {
    from { clip-path: inset(0 0 100% 0); }
    to { clip-path: inset(0 0 0 0); }
}

@keyframes dot {
    0%, 80%, 100% { transform: translateY(0); opacity: .35; }
    40% { transform: translateY(-5px); opacity: 1; }
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- scrollbars ---------- */

.chat-history,
.sidebar {
    scrollbar-width: thin;
    scrollbar-color: rgba(10, 10, 10, .35) transparent;
}

.chat-history::-webkit-scrollbar,
.sidebar::-webkit-scrollbar { width: 10px; }

.chat-history::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb {
    background: rgba(10, 10, 10, .3);
    border-radius: 6px;
}

/* ---------- narrow screens ---------- */

@media (max-width: 860px) {
    :root { --sidebar-w: 1fr; }

    .chat-container { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }

    .sidebar {
        max-height: 30dvh;
        gap: 10px;
        padding: 12px var(--gutter);
        border-bottom: 0;
    }

    .chat-input-container { padding: 12px var(--gutter) 14px; }

    header h1 { font-size: clamp(1.25rem, 4.5vw, 1.75rem); }

    .system-message .message-content,
    .typing-indicator { padding-left: 0; margin-left: 0; }

    .user-message { max-width: 88%; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
    }
}

</style>
</head>
<body>
    <header>
        <h1>传智教育EduRAG智慧问答系统</h1>
        <button class="theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <div class="container">
        <div class="chat-container">
            <div class="sidebar">
                <!-- 搜索框 -->
                <input type="text" class="search-box" id="searchBox" placeholder="搜索历史会话...">
                
                <!-- 会话控制按钮 -->
                <div class="session-controls">
                    <button class="new-session-btn" id="newSessionBtn">
                        <i class="fas fa-plus"></i> 新会话
                    </button>
                    <button class="clear-history-btn" id="clearHistoryBtn">
                        <i class="fas fa-trash"></i> 清除历史
                    </button>
                </div>
                <div class="history-title">
                    <i class="fas fa-history"></i> 历史会话
                </div>
                <div class="history-list" id="historyList">
                    <!-- 历史会话将动态添加到这里 -->
                </div>
                <div class="session-info" id="sessionInfo"></div>
            </div>

            <div class="main-content">
                <div class="chat-history" id="chatHistory">
                    <!-- 消息将动态添加到这里 -->
                    <div class="message system-message">
                        <div class="message-header">
                            <div class="avatar">智</div>
                            <span>智能助手</span>
                        </div>
                        <div class="message-content">
                            您好！我是智能问答助手，有什么我可以帮您的吗？
                        </div>
                    </div>
                </div>

                <div class="chat-input-container">
                    <div class="source-filter">
                        <label for="sourceFilter">学科类别：</label>
                        <select id="sourceFilter">
                            <option value="">全部</option>
                            <!-- 学科类别选项将动态添加 -->
                        </select>
                    </div>
                    <div class="input-tools">
                        <button class="tool-btn" id="emojiBtn" title="表情">
                            <i class="far fa-smile"></i>
                        </button>
                        <button class="tool-btn" id="imageBtn" title="图片">
                            <i class="far fa-image"></i>
                        </button>
                        <button class="tool-btn" id="fileBtn" title="文件">
                            <i class="far fa-file"></i>
                        </button>
                    </div>
                    <div class="input-group">
                        <textarea class="chat-input" id="chatInput" placeholder="请输入您的问题..."
                            rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" spellcheck="false"></textarea>
                        <button class="send-btn" id="sendBtn">
                            <i class="fas fa-paper-plane"></i> 发送
                        </button>
                    </div>
                    <!-- 快捷回复 -->
                    <div class="quick-replies" id="quickReplies">
                        <button class="quick-reply-btn">什么是人工智能？</button>
                        <button class="quick-reply-btn">机器学习有哪些算法？</button>
                        <button class="quick-reply-btn">如何学习Python？</button>
                    </div>
                </div>

                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentSessionId = null; // 当前会话 ID
        let isResponseInProgress = false; // 是否正在处理响应
        let socket = null; // WebSocket 连接
        let isDarkMode = false; // 是否深色模式

        // DOM 元素
        const chatHistory = document.getElementById('chatHistory'); // 聊天历史容器
        const chatInput = document.getElementById('chatInput'); // 输入框
        const sendBtn = document.getElementById('sendBtn'); // 发送按钮
        const sourceFilter = document.getElementById('sourceFilter'); // 学科过滤器
        const historyList = document.getElementById('historyList'); // 历史列表
        const sessionInfo = document.getElementById('sessionInfo'); // 会话信息
        const newSessionBtn = document.getElementById('newSessionBtn'); // 新会话按钮
        const clearHistoryBtn = document.getElementById('clearHistoryBtn'); // 清除历史按钮
        const loadingOverlay = document.getElementById('loadingOverlay'); // 加载遮罩
        const themeToggle = document.getElementById('themeToggle'); // 主题切换按钮
        const searchBox = document.getElementById('searchBox'); // 搜索框
        const quickReplies = document.getElementById('quickReplies'); // 快捷回复
        const quickReplyBtns = quickReplies.querySelectorAll('.quick-reply-btn'); // 快捷回复按钮
        const emojiBtn = document.getElementById('emojiBtn'); // 表情按钮
        const imageBtn = document.getElementById('imageBtn'); // 图片按钮
        const fileBtn = document.getElementById('fileBtn'); // 文件按钮

        // API URL 前缀，根据部署环境调整
        const API_BASE_URL = ''; // 如果 API 和前端在同一域，可以留空

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', async () => {
            // 检查本地存储中的主题设置
            isDarkMode = localStorage.getItem('darkMode') === 'true';
            updateTheme();

            // 创建新会话
            await createNewSession();

            // 加载学科类别
            await loadSources();

            // 事件监听器
            sendBtn.addEventListener('click', sendMessage); // 发送按钮点击事件
            chatInput.addEventListener('keydown', (e) => { // 输入框键盘事件
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            newSessionBtn.addEventListener('click', createNewSession); // 新会话按钮点击事件
            clearHistoryBtn.addEventListener('click', clearHistory); // 清除历史按钮点击事件
            themeToggle.addEventListener('click', toggleTheme); // 主题切换按钮点击事件
            searchBox.addEventListener('input', searchHistory); // 搜索框输入事件

            // 快捷回复按钮点击事件
            quickReplyBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    chatInput.value = btn.textContent;
                    chatInput.style.height = 'auto';
                    chatInput.style.height = chatInput.scrollHeight + 'px';
                    sendMessage();
                });
            });

            // 工具按钮点击事件
            emojiBtn.addEventListener('click', () => alert('表情选择功能开发中'));
            imageBtn.addEventListener('click', () => alert('图片上传功能开发中'));
            fileBtn.addEventListener('click', () => alert('文件上传功能开发中'));
        });

        // 切换主题
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            localStorage.setItem('darkMode', isDarkMode);
            updateTheme();
        }

        // 更新主题
        function updateTheme() {
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.body.classList.remove('dark-mode');
                themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
            }
        }

        // 搜索历史会话
        function searchHistory() {
            const searchTerm = searchBox.value.toLowerCase();
            const historyItems = historyList.querySelectorAll('.history-item');

            historyItems.forEach(item => {
                const question = item.querySelector('.history-question').textContent.toLowerCase();
                const answer = item.querySelector('.history-answer').textContent.toLowerCase();

                if (question.includes(searchTerm) || answer.includes(searchTerm)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // 创建新会话
        async function createNewSession() {
            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/api/create_session`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error('创建会话失败');
                }

                const data = await response.json();
                currentSessionId = data.session_id; // 更新当前会话 ID

                // 更新会话信息
                sessionInfo.textContent = `会话ID: ${currentSessionId.slice(0, 8)}...`;

                // 清空聊天历史
                clearChatHistory();

                // 加载会话历史
                await loadHistory();

            } catch (error) {
                console.error('创建会话错误:', error);
                alert('创建会话失败，请刷新页面重试');
            } finally {
                hideLoading();
            }
        }

        // 加载学科类别
        async function loadSources() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/sources`);

                if (!response.ok) {
                    throw new Error('获取学科类别失败');
                }

                const data = await response.json();

                // 清空现有选项
                sourceFilter.innerHTML = '<option value="">全部</option>';

                // 添加学科类别选项
                data.sources.forEach(source => {
                    const option = document.createElement('option');
                    option.value = source;
                    option.textContent = source;
                    sourceFilter.appendChild(option);
                });

            } catch (error) {
                console.error('加载学科类别错误:', error);
            }
        }

        // 加载历史消息（支持多轮 QA）
        async function loadHistory() {
            if (!currentSessionId) return;

            try {
                const response = await fetch(`${API_BASE_URL}/api/history/${currentSessionId}`);

                if (!response.ok) {
                    throw new Error('获取历史记录失败');
                }

                const data = await response.json();

                // 清空历史列表
                historyList.innerHTML = '';

                // 将历史记录按会话分组
                const sessionItem = document.createElement('div');
                sessionItem.className = 'history-item';
                sessionItem.innerHTML = `
                    <div class="history-question">会话 ${currentSessionId.slice(0, 8)}...</div>
                    <div class="history-answer">共 ${data.history.length} 轮对话</div>
                `;

                // 点击历史记录项显示整个会话
                sessionItem.addEventListener('click', () => {
                    // 清空现有聊天记录
                    clearChatHistory();

                    // 添加整个会话的 QA 对
                    data.history.forEach(item => {
                        addMessage('user', item.question); // 添加用户问题
                        addMessage('system', item.answer); // 添加系统回答
                    });

                    // 滚动到底部
                    scrollToBottom();
                });

                historyList.appendChild(sessionItem);

            } catch (error) {
                console.error('加载历史记录错误:', error);
            }
        }

        // 清除历史记录
        async function clearHistory() {
            if (!currentSessionId) return;

            if (!confirm('确定要清除所有历史记录吗？')) {
                return;
            }

            showLoading();
            try {
                const response = await fetch(`${API_BASE_URL}/api/history/${currentSessionId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    throw new Error('清除历史记录失败');
                }

                // 清空历史列表
                historyList.innerHTML = '';

                // 清空聊天历史
                clearChatHistory();

                // 添加欢迎消息
                chatHistory.innerHTML = `
                    <div class="message system-message">
                        <div class="message-header">
                            <div class="avatar">智</div>
                            <span>智能助手</span>
                        </div>
                        <div class="message-content">
                            历史记录已清除，有什么我可以帮您的吗？
                        </div>
                    </div>
                `;

            } catch (error) {
                console.error('清除历史记录错误:', error);
                alert('清除历史记录失败');
            } finally {
                hideLoading();
            }
        }

        // 清空聊天历史
        function clearChatHistory() {
            chatHistory.innerHTML = `
                <div class="message system-message">
                    <div class="message-header">
                        <div class="avatar">智</div>
                        <span>智能助手</span>
                    </div>
                    <div class="message-content">
                        您好！我是智能问答助手，有什么我可以帮您的吗？
                    </div>
                </div>
            `;
        }

        // 显示加载遮罩
        function showLoading() {
            loadingOverlay.style.visibility = 'visible';
        }

        // 隐藏加载遮罩
        function hideLoading() {
            loadingOverlay.style.visibility = 'hidden';
        }

        // 发送消息
        async function sendMessage() {
            const query = chatInput.value.trim();
            const filter = sourceFilter.value;

            if (!query || isResponseInProgress) return;

            // 重置输入框
            chatInput.value = '';
            chatInput.style.height = 'auto';

            // 添加用户消息到聊天窗口
            addMessage('user', query);

            // 设置正在响应标志
            isResponseInProgress = true;

            // 添加正在输入指示器
            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.innerHTML = '<span></span><span></span><span></span>';
            chatHistory.appendChild(typingIndicator);

            // 滚动到底部
            scrollToBottom();

            try {
                // 发送查询请求
                const response = await fetch(`${API_BASE_URL}/api/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        source_filter: filter,
                        session_id: currentSessionId
                    })
                });

                if (!response.ok) {
                    throw new Error('查询失败');
                }

                const data = await response.json();

                // 移除输入指示器
                if (typingIndicator.parentNode) {
                    chatHistory.removeChild(typingIndicator);
                }

                // 如果需要流式输出，使用 WebSocket
                if (data.is_streaming) {
                    // 创建系统消息容器，但内容为空
                    const messageElement = document.createElement('div');
                    messageElement.className = 'message system-message';

                    const headerElement = document.createElement('div');
                    headerElement.className = 'message-header';
                    headerElement.innerHTML = `
                        <div class="avatar">智</div>
                        <span>智能助手</span>
                    `;

                    const contentElement = document.createElement('div');
                    contentElement.className = 'message-content';
                    contentElement.innerHTML = ''; // 初始化为空

                    messageElement.appendChild(headerElement);
                    messageElement.appendChild(contentElement);
                    chatHistory.appendChild(messageElement);

                    // 建立 WebSocket 连接进行流式输出
                    await handleStreamingResponse(query, filter, contentElement);
                } else {
                    // 直接添加格式化后的答案
                    addMessage('system', data.answer);
                }

                // 重新加载历史记录
                await loadHistory();

            } catch (error) {
                console.error('发送消息错误:', error);

                // 移除输入指示器
                if (typingIndicator.parentNode) {
                    chatHistory.removeChild(typingIndicator);
                }

                // 添加错误消息
                addMessage('system', `抱歉，发生错误: ${error.message}`);
            } finally {
                // 清除正在响应标志
                isResponseInProgress = false;

                // 滚动到底部
                scrollToBottom();
            }
        }

        // 处理流式响应
        async function handleStreamingResponse(query, filter, contentElement) {
            // 关闭现有连接
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }

            return new Promise((resolve, reject) => {
                // WebSocket URL
                const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${wsProtocol}//${window.location.host}${API_BASE_URL}/api/stream`;

                // 创建 WebSocket 连接
                socket = new WebSocket(wsUrl);

                let accumulatedContent = ''; // 累积流式内容

                // 连接建立时
                socket.onopen = function() {
                    console.log('WebSocket 连接已建立');

                    // 发送查询请求
                    socket.send(JSON.stringify({
                        query: query,
                        source_filter: filter,
                        session_id: currentSessionId
                    }));
                };

                // 接收消息时
                socket.onmessage = function(event) {
                    const data = JSON.parse(event.data);

                    switch (data.type) {
                        case 'start':
                            console.log('流式响应开始');
                            break;

                        case 'token':
                            // 追加 token 到内容
                            accumulatedContent += data.token;
                            // 使用 marked.js 解析 Markdown 格式
                            contentElement.innerHTML = marked.parse(accumulatedContent ?? '');
                            scrollToBottom();
                            break;

                        case 'end':
                            console.log('流式响应结束');
                            socket.close();
                            resolve();
                            break;

                        case 'error':
                            console.error('流式响应错误:', data.error);
                            contentElement.innerHTML += `<p>[错误: ${data.error}]</p>`;
                            socket.close();
                            reject(new Error(data.error));
                            break;
                    }
                };

                // 发生错误时
                socket.onerror = function(error) {
                    console.error('WebSocket 错误:', error);
                    contentElement.innerHTML += '<p>[连接错误]</p>';
                    reject(error);
                };

                // 连接关闭时
                socket.onclose = function() {
                    console.log('WebSocket 连接已关闭');
                    resolve();
                };
            });
        }

        // 添加消息到聊天窗口（支持 Markdown 格式）
        function addMessage(type, content) {
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type === 'user' ? 'user-message' : 'system-message'}`;

            // 添加消息头部
            const headerElement = document.createElement('div');
            headerElement.className = 'message-header';

            if (type === 'user') {
                headerElement.innerHTML = `
                    <div class="avatar">用</div>
                    <span>我</span>
                `;
            } else {
                headerElement.innerHTML = `
                    <div class="avatar">智</div>
                    <span>智能助手</span>
                `;
            }

            const contentElement = document.createElement('div');
            contentElement.className = 'message-content';
            // 使用 marked.js 解析 Markdown 格式（支持换行和代码块）
            contentElement.innerHTML = marked.parse(content ?? '');

            messageElement.appendChild(headerElement);
            messageElement.appendChild(contentElement);
            chatHistory.appendChild(messageElement);

            // 滚动到底部
            scrollToBottom();
        }

        // 滚动到底部
        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
</html>
